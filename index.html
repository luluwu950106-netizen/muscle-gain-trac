<script>
const $=id=>document.getElementById(id),
      TODAY=new Date().toLocaleDateString('en-CA');

$('date').value=$('mdate').value=$('mealDate').value=TODAY;

/* =========================
   讀取 localStorage
========================= */
let daily=JSON.parse(localStorage.getItem('mg_daily_v3')||'[]');
let meals=JSON.parse(localStorage.getItem('mg_meals_v4')||'[]');
let measures=JSON.parse(localStorage.getItem('mg_measures_v3')||'[]');

const DEFAULT_SETTINGS={
  goalWeight:58,
  goalCalories:2150,
  goalProtein:110,
  goalSteps:10000
};

let savedSettings={};

try{
  savedSettings=
    JSON.parse(localStorage.getItem('mg_settings_v3')||'{}')||{};
}catch(e){
  savedSettings={};
}

let settings={
  ...DEFAULT_SETTINGS,
  ...savedSettings
};

Object.keys(DEFAULT_SETTINGS).forEach(k=>{
  if(
    settings[k]===null ||
    settings[k]==='' ||
    !Number.isFinite(Number(settings[k]))
  ){
    settings[k]=DEFAULT_SETTINGS[k];
  }

  if($(k)){
    $(k).value=settings[k];
  }
});


/* =========================
   圍度設定
========================= */

const keys=[
  'waist',
  'chest',
  'leftArm',
  'rightArm',
  'hips',
  'leftThigh',
  'rightThigh'
];

const labels={
  waist:'腰圍',
  chest:'胸圍',
  leftArm:'左上臂',
  rightArm:'右上臂',
  hips:'臀圍',
  leftThigh:'左大腿',
  rightThigh:'右大腿'
};

const interval={
  waist:7,
  chest:14,
  leftArm:14,
  rightArm:14,
  hips:14,
  leftThigh:14,
  rightThigh:14
};


/* =========================
   共用函式
========================= */

function N(id){
  return $(id).value==='' ? null : Number($(id).value);
}

function days(a,b){
  return Math.floor(
    (
      new Date(b+'T00:00:00')-
      new Date(a+'T00:00:00')
    )/86400000
  );
}

function lastWith(k){
  return measures
    .filter(x=>x[k]!=null)
    .slice(-1)[0];
}

function due(k){
  let x=lastWith(k);

  return !x ||
    days(x.date,TODAY)>=interval[k];
}

function avg(arr,k){

  let a=arr
    .map(x=>x[k])
    .filter(v=>v!=null);

  return a.length
    ? a.reduce((s,v)=>s+v,0)/a.length
    : null;
}

function safe(v){

  return String(v??'—')
    .replace(
      /[&<>"']/g,
      c=>({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[c])
    );
}

function persist(){

  localStorage.setItem(
    'mg_daily_v3',
    JSON.stringify(daily)
  );

  localStorage.setItem(
    'mg_measures_v3',
    JSON.stringify(measures)
  );

  render();
}


/* =========================
   每日紀錄
========================= */

function loadDaily(date){

  let x=daily.find(
    v=>v.date===date
  );

  $('date').value=date;

  [
    'weight',
    'calories',
    'protein',
    'carbs',
    'fat',
    'steps',
    'sleep'
  ].forEach(k=>{

    $(k).value=
      x?.[k]??'';

  });

  $('training').value=
    x?.training||'Rest';

  $('note').value=
    x?.note||'';

  $('dailySubmitBtn').textContent=
    x
    ? '更新這天紀錄'
    : '儲存今日紀錄';
}


$('date').onchange=()=>{

  loadDaily(
    $('date').value
  );

};


$('dailyForm').onsubmit=e=>{

  e.preventDefault();

  let date=
    $('date').value;

  let old=
    daily.find(
      v=>v.date===date
    )||{};

  let x={
    ...old,
    date
  };

  [
    'weight',
    'calories',
    'protein',
    'carbs',
    'fat',
    'steps',
    'sleep'
  ].forEach(k=>{

    let v=N(k);

    if(v!=null){
      x[k]=v;
    }

    else if(!(k in old)){
      x[k]=null;
    }

  });

  x.training=
    $('training').value ||
    old.training ||
    'Rest';

  let note=
    $('note').value;

  x.note=
    note!==''
    ? note
    : (old.note||'');

  daily=
    daily.filter(
      v=>v.date!==date
    );

  daily.push(x);

  daily.sort(
    (a,b)=>
      a.date.localeCompare(b.date)
  );

  persist();

  loadDaily(date);

  alert(
    '紀錄已儲存／更新'
  );
};


/* =========================
   圍度紀錄
========================= */

let editingMeasureDate=null;

function loadMeasure(date){
  let x=measures.find(v=>v.date===date);
  if(!x){
    alert('這一天沒有圍度紀錄');
    return;
  }

  editingMeasureDate=date;
  $('mdate').value=date;

  keys.forEach(k=>{
    $(k).value=x[k]??'';
    let field=$(k).closest('.measureField');
    if(field) field.style.display='block';
  });

  $('measureCard').style.display='block';

  let btn=$('measureForm').querySelector('button[type="submit"]');
  if(btn) btn.textContent='更新這天圍度';

  $('measureForm').scrollIntoView({behavior:'smooth'});
}

function cancelMeasureEdit(){
  editingMeasureDate=null;
  $('measureForm').reset();
  $('mdate').value=TODAY;
  let btn=$('measureForm').querySelector('button[type="submit"]');
  if(btn) btn.textContent='儲存圍度紀錄';
  render();
}

$('mdate').onchange=()=>{
  let date=$('mdate').value;
  let x=measures.find(v=>v.date===date);

  if(x){
    editingMeasureDate=date;
    keys.forEach(k=>{
      $(k).value=x[k]??'';
      let field=$(k).closest('.measureField');
      if(field) field.style.display='block';
    });
    $('measureCard').style.display='block';
    let btn=$('measureForm').querySelector('button[type="submit"]');
    if(btn) btn.textContent='更新這天圍度';
  }else{
    editingMeasureDate=null;
    keys.forEach(k=>$(k).value='');
    let btn=$('measureForm').querySelector('button[type="submit"]');
    if(btn) btn.textContent='儲存圍度紀錄';
    render();
  }
};

$('measureForm').onsubmit=e=>{
  e.preventDefault();

  let date=$('mdate').value;
  let old=measures.find(v=>v.date===date)||{};
  let x={...old,date};

  keys.forEach(k=>{
    let v=N(k);
    if(v!=null) x[k]=v;
    else if(!(k in old)) x[k]=null;
  });

  measures=measures.filter(v=>v.date!==date);
  measures.push(x);
  measures.sort((a,b)=>a.date.localeCompare(b.date));

  persist();

  editingMeasureDate=null;
  e.target.reset();
  $('mdate').value=TODAY;
  let btn=$('measureForm').querySelector('button[type="submit"]');
  if(btn) btn.textContent='儲存圍度紀錄';

  alert('圍度紀錄已儲存／更新');
};

function renderMeasureHistory(){
  let host=$('measureHistory');
  if(!host) return;

  if(!measures.length){
    host.innerHTML='<div style="opacity:.7">尚無圍度紀錄。</div>';
    return;
  }

  host.innerHTML=`
    <div style="overflow-x:auto">
      <table style="width:100%;font-size:12px;border-collapse:collapse">
        <thead><tr>
          <th>日期</th><th>腰圍</th><th>胸圍</th><th>左臂</th><th>右臂</th><th>臀圍</th><th>左腿</th><th>右腿</th><th></th>
        </tr></thead>
        <tbody>
          ${measures.slice().reverse().map(x=>`
            <tr>
              <td>${safe(x.date)}</td>
              <td>${x.waist??'—'}</td><td>${x.chest??'—'}</td>
              <td>${x.leftArm??'—'}</td><td>${x.rightArm??'—'}</td>
              <td>${x.hips??'—'}</td><td>${x.leftThigh??'—'}</td><td>${x.rightThigh??'—'}</td>
              <td><button type="button" style="width:auto;padding:3px 8px;font-size:11px" onclick="loadMeasure('${x.date}')">編輯</button></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

function ensureMeasureHistoryUI(){
  if($('measureHistory')) return;
  let card=$('measureCard');
  if(!card) return;

  let wrap=document.createElement('div');
  wrap.style.marginTop='18px';
  wrap.innerHTML=`
    <hr style="opacity:.2;margin:16px 0">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
      <b>📏 圍度歷史紀錄</b>
      <button type="button" class="secondary" style="width:auto;padding:6px 10px" onclick="cancelMeasureEdit()">取消編輯／回到今天</button>
    </div>
    <div id="measureHistory" style="margin-top:10px"></div>`;
  card.appendChild(wrap);
}

/* =========================
   飲食紀錄
========================= */

$('mealForm').onsubmit=e=>{

  e.preventDefault();

  let text=
    $('mealText')
      .value
      .trim();

  if(!text){
    return;
  }

  meals.push({

    date:
      $('mealDate').value,

    type:
      $('mealType').value,

    text

  });

  localStorage.setItem(
    'mg_meals_v4',
    JSON.stringify(meals)
  );

  $('mealText').value='';

  render();
};


/* =========================
   ★ 選日期查看飲食
========================= */

$('mealDate').onchange=()=>{

  renderMealsForDate(
    $('mealDate').value
  );

};


function renderMealsForDate(date){

  let dm=
    meals.filter(
      x=>x.date===date
    );

  if(dm.length){

    $('todayMeals').innerHTML=

      `<b>${safe(date)} 飲食紀錄：</b><br>`+

      dm.map(
        (x,i)=>

        `• ${safe(x.type)}：${safe(x.text)}

        <button
          type="button"
          class="danger"
          style="
            width:auto;
            padding:3px 8px;
            margin-left:5px;
            font-size:11px
          "
          onclick="
            deleteMeal(
              '${date}',
              ${i}
            )
          "
        >
          刪除
        </button>`

      ).join('<br>');

  }

  else{

    $('todayMeals').innerHTML=
      `${safe(date)} 尚未輸入食物。`;

  }
}


/* =========================
   ★ 刪除單筆飲食
========================= */

function deleteMeal(
  date,
  index
){

  let positions=[];

  meals.forEach(
    (x,i)=>{

      if(x.date===date){
        positions.push(i);
      }

    }
  );

  if(
    positions[index]==null
  ){
    return;
  }

  if(
    confirm(
      '確定刪除這筆飲食紀錄？'
    )
  ){

    meals.splice(
      positions[index],
      1
    );

    localStorage.setItem(
      'mg_meals_v4',
      JSON.stringify(meals)
    );

    render();
  }
}


/* =========================
   ★ 清除指定日期飲食
========================= */

$('clearMeals').onclick=()=>{

  let date=
    $('mealDate').value;

  if(
    confirm(
      `確定清除 ${date} 的飲食原始紀錄？`
    )
  ){

    meals=
      meals.filter(
        x=>x.date!==date
      );

    localStorage.setItem(
      'mg_meals_v4',
      JSON.stringify(meals)
    );

    render();
  }
};


/* =========================
   ★ 複製指定日期給 AI
========================= */

$('copyAIPrompt').onclick=
async()=>{

  let selectedDate=
    $('mealDate').value;

  let m=
    meals.filter(
      x=>x.date===selectedDate
    );

  if(!m.length){

    alert(
      '所選日期還沒有飲食紀錄'
    );

    return;
  }

  let txt=

`請幫我估算以下 ${selectedDate} 飲食的總熱量與三大營養素。

請逐項列出 kcal、蛋白質、碳水、脂肪；份量不確定的項目請給合理估算並標註不確定性。

最後加總，並和我的每日目標比較：
${settings.goalCalories} kcal、
蛋白質 ${settings.goalProtein} g。

飲食：
`+

  m.map(
    x=>
      `${x.type}：${x.text}`
  ).join('\n');


  try{

    await navigator
      .clipboard
      .writeText(txt);

    alert(
      '已複製！直接貼到 ChatGPT 即可。'
    );

  }

  catch(e){

    prompt(
      '請複製下面文字：',
      txt
    );

  }

};


/* =========================
   目標設定
========================= */

$('saveSettings').onclick=()=>{

  settings={

    goalWeight:
      N('goalWeight')
      ??DEFAULT_SETTINGS.goalWeight,

    goalCalories:
      N('goalCalories')
      ??DEFAULT_SETTINGS.goalCalories,

    goalProtein:
      N('goalProtein')
      ??DEFAULT_SETTINGS.goalProtein,

    goalSteps:
      N('goalSteps')
      ??DEFAULT_SETTINGS.goalSteps

  };

  Object
    .keys(settings)
    .forEach(k=>{

      if($(k)){
        $(k).value=settings[k];
      }

    });

  localStorage.setItem(
    'mg_settings_v3',
    JSON.stringify(settings)
  );

  render();

  alert(
    '增肌期目標已儲存'
  );
};


/* =========================
   畫面更新
========================= */

function render(){

  $('todayBadge').textContent=
    TODAY;


  /* 顯示目前選取日期的飲食 */

  let selectedMealDate=
    $('mealDate').value||TODAY;

  renderMealsForDate(
    selectedMealDate
  );


  /* 今日提醒 */

  let first=
    measures.length===0;

  let dueKeys=
    keys.filter(due);

  let logged=
    daily.some(
      x=>x.date===TODAY
    );

  let msgs=[

    logged
    ? '✓ 今日每日紀錄已完成'
    : '● 今天：晨起體重、飲食、步數、訓練'

  ];


  if(first){

    msgs.push(
      '● 明早建立正式增肌期 Baseline：一次量完所有圍度'
    );

  }

  else if(
    dueKeys.length
  ){

    msgs.push(
      '● 今天到期：'+
      dueKeys
        .map(k=>labels[k])
        .join('、')
    );

  }

  else{

    let next=
      keys.map(k=>{

        let x=
          lastWith(k);

        return{

          k,

          remain:
            interval[k]-
            days(
              x.date,
              TODAY
            )

        };

      })
      .sort(
        (a,b)=>
          a.remain-b.remain
      )[0];

    msgs.push(
      `✓ 今天不用量圍度；下一項：${labels[next.k]}，約 ${next.remain} 天後`
    );

  }


  $('reminders').innerHTML=

    msgs.map(
      m=>
      `<div class="${
        m.startsWith('✓')
        ?'ok'
        :'due'
      }">
        ${m}
      </div>`
    ).join('');


  /* 圍度 */

  $('measureTitle').textContent=
    first
    ? '建立增肌期 Baseline'
    : '到期圍度紀錄';


  $('measureIntro').textContent=
    first
    ? '第一次請一次量完；之後系統只顯示到期項目。'
    : '沒有到期的圍度會自動隱藏。';


  document
    .querySelectorAll(
      '.measureField'
    )
    .forEach(el=>{

      let k=
        el.dataset.key;

      el.style.display=
        (
          editingMeasureDate ||
          first ||
          due(k)
        )
        ? 'block'
        : 'none';

    });


  /* 圍度卡永遠保留，方便查看歷史與修改輸入錯誤 */
  $('measureCard').style.display='block';
  ensureMeasureHistoryUI();
  renderMeasureHistory();


  /* 近 7 日平均 */

  let last7=
    daily.slice(-7);

  let aw=
    avg(
      last7,
      'weight'
    );

  let ac=
    avg(
      last7,
      'calories'
    );

  let ap=
    avg(
      last7,
      'protein'
    );


  $('avgWeight').textContent=
    aw
    ? aw.toFixed(2)
    : '—';


  $('avgCalories').textContent=
    ac
    ? Math.round(ac)
    : '—';


  $('avgProtein').textContent=
    ap
    ? Math.round(ap)
    : '—';


  let w=
    lastWith('waist');

  $('latestWaist').textContent=
    w
    ? w.waist.toFixed(1)
    : '—';


  let baseline=
    daily.length
    ? daily[0].weight
    : null;


  let goal=
    Number(
      settings.goalWeight||58
    );


  let pct=
    (
      aw &&
      baseline &&
      goal!==baseline
    )
    ?
    Math.max(
      0,
      Math.min(
        100,
        (
          (aw-baseline)/
          (goal-baseline)
        )*100
      )
    )
    :
    0;


  $('bar').style.width=
    pct+'%';


  $('progressText').textContent=
    aw
    ?
    `目前 7 日平均 ${aw.toFixed(2)} kg；目標 ${goal.toFixed(1)} kg`
    :
    '累積數據後顯示 7 日平均';


  /* 近期紀錄 */

  $('rows').innerHTML=

    daily
      .slice()
      .reverse()
      .slice(0,14)
      .map(x=>

      `<tr
        data-date="${x.date}"
        style="cursor:pointer"
      >

        <td>${x.date}</td>

        <td>
          ${x.weight??'—'}
        </td>

        <td>
          ${x.calories??'—'}
        </td>

        <td>
          ${x.protein??'—'}
        </td>

        <td>
          ${x.carbs??'—'}
        </td>

        <td>
          ${x.fat??'—'}
        </td>

        <td>
          ${x.steps??'—'}
        </td>

        <td>
          ${x.training||'—'}
        </td>

      </tr>`

    ).join('');


  document
    .querySelectorAll(
      '#rows tr'
    )
    .forEach(
      tr=>
        tr.onclick=
          ()=>
            showRecordDetail(
              tr.dataset.date
            )
    );

}


/* =========================
   ★ 查看某一天完整紀錄
========================= */

function showRecordDetail(date){

  let x=
    daily.find(
      v=>v.date===date
    );

  if(!x){
    return;
  }

  let dm=
    meals.filter(
      v=>v.date===date
    );

  let d=
    $('recordDetail');

  d.style.display=
    'block';


  d.innerHTML=

  `<b>${safe(date)} 完整紀錄</b>

  <br>

  體重：
  ${x.weight??'—'} kg

  ｜熱量：
  ${x.calories??'—'} kcal

  <br>

  蛋白質：
  ${x.protein??'—'} g

  ｜碳水：
  ${x.carbs??'—'} g

  ｜脂肪：
  ${x.fat??'—'} g

  <br>

  步數：
  ${x.steps??'—'}

  ｜訓練：
  ${safe(x.training)}

  ｜睡眠：
  ${x.sleep??'—'} hr

  <br><br>

  <b>🍽 飲食明細：</b>

  <br>

  ${
    dm.length
    ?
    dm.map(
      v=>
      `• ${safe(v.type)}：${safe(v.text)}`
    ).join('<br>')
    :
    '（這天沒有保存飲食明細）'
  }

  <br><br>

  <b>備註：</b>

  <span
    style="white-space:pre-wrap"
  >
    ${safe(x.note)}
  </span>

  <br>

  <button
    type="button"
    style="margin-top:8px"
    onclick="
      loadDaily('${date}');
      document
        .getElementById('dailyForm')
        .scrollIntoView({
          behavior:'smooth'
        })
    "
  >
    編輯這天
  </button>

  <button
    type="button"
    class="secondary"
    style="margin-top:8px"
    onclick="
      document
        .getElementById('mealDate')
        .value='${date}';

      renderMealsForDate(
        '${date}'
      );

      document
        .getElementById('mealForm')
        .scrollIntoView({
          behavior:'smooth'
        })
    "
  >
    查看／修改這天飲食
  </button>`;

}


/* =========================
   CSV
========================= */

function cell(v){

  return '"'+
    String(v??'')
      .replace(
        /"/g,
        '""'
      )+
    '"';

}


function downloadCSV(
  name,
  headers,
  rows
){

  let csv=

    '\uFEFF'+

    headers
      .map(cell)
      .join(',')

    +'\n'+

    rows
      .map(
        r=>
          r.map(cell)
           .join(',')
      )
      .join('\n');


  let a=
    document.createElement(
      'a'
    );


  a.href=
    URL.createObjectURL(

      new Blob(
        [csv],
        {
          type:
          'text/csv;charset=utf-8'
        }
      )

    );


  a.download=name;

  a.click();


  setTimeout(
    ()=>
      URL.revokeObjectURL(
        a.href
      ),
    500
  );

}


/* 每日紀錄 CSV */

$('exportCsvBtn').onclick=
()=>downloadCSV(

  'muscle_gain_daily.csv',

  [
    '日期',
    '體重 kg',
    '熱量 kcal',
    '蛋白質 g',
    '碳水 g',
    '脂肪 g',
    '步數',
    '訓練',
    '睡眠 hr',
    '備註'
  ],

  daily.map(
    x=>[
      x.date,
      x.weight,
      x.calories,
      x.protein,
      x.carbs,
      x.fat,
      x.steps,
      x.training,
      x.sleep,
      x.note
    ]
  )

);


/* 圍度 CSV */

/* =========================
   Excel 匯出（.xlsx）
   使用 SheetJS CDN；若離線，會提示改用 CSV/JSON。
========================= */

function ensureExcelButton(){
  if($('exportExcelBtn')) return;

  let anchor=$('exportCsvBtn') || $('exportBtn');
  if(!anchor) return;

  let btn=document.createElement('button');
  btn.type='button';
  btn.id='exportExcelBtn';
  btn.className='secondary';
  btn.style.marginTop='8px';
  btn.textContent='匯出 Excel（.xlsx）';
  btn.onclick=exportExcel;
  anchor.insertAdjacentElement('afterend',btn);
}

function loadSheetJS(){
  return new Promise((resolve,reject)=>{
    if(window.XLSX){ resolve(); return; }

    let script=document.createElement('script');
    script.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    script.onload=()=>resolve();
    script.onerror=()=>reject(new Error('SheetJS 載入失敗'));
    document.head.appendChild(script);
  });
}

async function exportExcel(){
  try{
    await loadSheetJS();

    const dailyRows=daily.map(x=>({
      '日期':x.date,
      '體重 kg':x.weight??'',
      '熱量 kcal':x.calories??'',
      '蛋白質 g':x.protein??'',
      '碳水 g':x.carbs??'',
      '脂肪 g':x.fat??'',
      '步數':x.steps??'',
      '訓練':x.training??'',
      '睡眠 hr':x.sleep??'',
      '備註':x.note??''
    }));

    const measureRows=measures.map(x=>({
      '日期':x.date,
      '腰圍 cm':x.waist??'',
      '胸圍 cm':x.chest??'',
      '左上臂 cm':x.leftArm??'',
      '右上臂 cm':x.rightArm??'',
      '臀圍 cm':x.hips??'',
      '左大腿 cm':x.leftThigh??'',
      '右大腿 cm':x.rightThigh??''
    }));

    const mealRows=meals.map(x=>({
      '日期':x.date,
      '餐別':x.type??'',
      '飲食內容':x.text??''
    }));

    const dates=[...new Set([
      ...daily.map(x=>x.date),
      ...measures.map(x=>x.date),
      ...meals.map(x=>x.date)
    ])].sort();

    const summaryRows=dates.map(date=>{
      let d=daily.find(x=>x.date===date)||{};
      let m=measures.find(x=>x.date===date)||{};
      return {
        '日期':date,
        '體重 kg':d.weight??'',
        '熱量 kcal':d.calories??'',
        '蛋白質 g':d.protein??'',
        '碳水 g':d.carbs??'',
        '脂肪 g':d.fat??'',
        '步數':d.steps??'',
        '訓練':d.training??'',
        '睡眠 hr':d.sleep??'',
        '腰圍 cm':m.waist??'',
        '胸圍 cm':m.chest??'',
        '臀圍 cm':m.hips??''
      };
    });

    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(dailyRows),'Daily');
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(measureRows),'Measurements');
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(mealRows),'Meals');
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(summaryRows),'Summary');

    XLSX.writeFile(wb,'muscle_gain_tracker.xlsx');
  }catch(e){
    alert('Excel 匯出需要網路載入 Excel 元件。目前載入失敗；你的資料仍安全保存在 App 中，也可先使用 CSV 或 JSON 備份。');
  }
}

/* =========================
   JSON 完整備份
========================= */

$('exportBtn').onclick=()=>{

  let payload={

    exportedAt:
      new Date()
        .toISOString(),

    settings,

    daily,

    measures,

    meals

  };


  let a=
    document.createElement(
      'a'
    );


  a.href=
    URL.createObjectURL(

      new Blob(

        [
          JSON.stringify(
            payload,
            null,
            2
          )
        ],

        {
          type:
          'application/json'
        }

      )

    );


  a.download=
    'muscle_gain_tracker_backup.json';


  a.click();


  setTimeout(
    ()=>
      URL.revokeObjectURL(
        a.href
      ),
    500
  );

};
